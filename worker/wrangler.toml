name = "otaku-oracle-answer"
main = "src/index.ts"
compatibility_date = "2026-11-04"
workers_dev = true

[vars]
SITE_ORIGIN = "https://otaku-oracle.brejesh-bala.workers.dev"
CLIENT_DAILY_LIMIT = "50"
MODEL_DAILY_BUDGET = "100"
PROVIDER_COOLDOWN_SECONDS = "900"
PROVIDER_TIMEOUT_MS = "8000"
REQUEST_DEADLINE_MS = "15000"
# Off while Jikan times out from Cloudflare: with it on, two agreeing sources are needed and no claim can be verified.
MULTI_SOURCE_ENABLED = "false"
SOURCE_DAILY_BUDGET = "500"

[[d1_databases]]
binding = "DB"
database_name = "oracle"
database_id = "2e24da73-a558-4816-aecf-160ab2e102d3"
migrations_dir = "migrations"

[triggers]
crons = ["17 2 * * *"]
