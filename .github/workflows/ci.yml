name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.paths.outputs.web }}
    steps:
      - uses: actions/checkout@v4.2.2
      - id: paths
        run: |
          if test -f web/package.json; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v6.8.0
        with:
          version: "0.11.21"
          python-version: "3.11"
      - run: uv run --project eval --locked python -m pytest eval/tests
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: node --test ../scripts/smoke-live.test.mjs
      - run: npm run build
  web:
    needs: layout
    if: needs.layout.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npx tsc -b
      - run: npx vite build
